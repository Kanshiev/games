<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Куб Антоши — Geometry Dash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0f0f1a; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #ui {
    position: fixed; top: 0; left: 0; right: 0; padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 10; font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .stat {
    background: rgba(0,0,0,0.55); color: #fff; padding: 6px 12px;
    border-radius: 10px; font-size: 15px; font-weight: 700;
    backdrop-filter: blur(4px);
  }
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.72);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif;
    text-align: center; padding: 20px;
  }
  #overlay h1 { font-size: 42px; margin-bottom: 8px; text-shadow: 0 4px 0 #e94560; }
  #overlay p { font-size: 18px; opacity: 0.9; margin-bottom: 24px; max-width: 320px; line-height: 1.4; }
  #overlay .btn {
    background: #e94560; color: #fff; border: none; padding: 14px 36px;
    font-size: 20px; font-weight: 800; border-radius: 14px; cursor: pointer;
    box-shadow: 0 6px 0 #b8324a; pointer-events: auto;
  }
  #overlay .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8324a; }
  .hidden { display: none !important; }
  #hint {
    position: fixed; bottom: 24px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,0.7); font-family: system-ui; font-size: 14px;
    pointer-events: none; z-index: 5;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="stat">Очки: <span id="score">0</span></div>
  <div class="stat">Попытки: <span id="attempts">1</span></div>
</div>
<div id="hint">Тап / Пробел / Клик — прыжок</div>
<div id="overlay">
  <h1>Куб Антоши</h1>
  <p>Случайная карта, всегда проходимая.<br>Прыгай через ямы и шипы!</p>
  <button class="btn" id="startBtn">ИГРАТЬ</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const attemptsEl = document.getElementById('attempts');
  const overlay = document.getElementById('overlay');
  const hint = document.getElementById('hint');
  const startBtn = document.getElementById('startBtn');

  // --- Config ---
  const CFG = {
    gravity: 0.55,
    jumpVel: -11.2,
    speed: 6.2,          // world scroll speed
    playerSize: 36,
    groundY: 0,          // will be set from canvas
    maxGap: 190,         // max gap width (must be jumpable)
    chunkW: 520,
    colors: {
      bg: '#1a1a2e',
      ground: '#16213e',
      platform: '#0f3460',
      spike: '#e94560',
      player: '#e94560',
      playerEye: '#fff',
      particle: '#f9c74f'
    }
  };

  let W, H, groundY;
  let running = false;
  let dead = false;
  let camX = 0;
  let score = 0;
  let attempts = 1;
  let particles = [];
  let shake = 0;

  // Player
  const player = {
    x: 120,          // fixed screen X
    y: 0,
    vy: 0,
    onGround: false,
    squish: 1,       // scaleY for juice
    rot: 0
  };

  // World objects: platforms & spikes (in world coords)
  let platforms = [];  // {x, y, w, h}
  let spikes = [];     // {x, y, w, h}  (triangle-ish via path)

  // --- Resize ---
  function resize() {
    W = canvas.width = window.innerWidth * devicePixelRatio;
    H = canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    groundY = Math.floor(window.innerHeight * 0.72);
    CFG.groundY = groundY;
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Generation (always passable) ---
  let nextChunkX = 0;
  let lastFloorY = groundY;
  let difficulty = 0; // grows slowly

  function resetWorld() {
    platforms = [];
    spikes = [];
    nextChunkX = 0;
    lastFloorY = groundY;
    difficulty = 0;
    camX = 0;
    // starting solid ground
    platforms.push({ x: -200, y: groundY, w: 700, h: 400 });
    nextChunkX = 500;
    // pre-generate a few chunks
    for (let i = 0; i < 6; i++) generateChunk();
  }

  function generateChunk() {
    const startX = nextChunkX;
    const endX = startX + CFG.chunkW;
    difficulty = Math.min(1, camX / 8000);

    // Decide pattern type weighted by difficulty
    const r = Math.random();
    let pattern;
    if (r < 0.35 - difficulty * 0.15) pattern = 'flat';
    else if (r < 0.55) pattern = 'gap';
    else if (r < 0.75) pattern = 'steps';
    else if (r < 0.9) pattern = 'spikes';
    else pattern = 'mixed';

    let cursor = startX;
    const floorH = 400;

    if (pattern === 'flat') {
      const len = 280 + Math.random() * 180;
      platforms.push({ x: cursor, y: lastFloorY, w: len, h: floorH });
      cursor += len;
    }
    else if (pattern === 'gap') {
      // solid → gap → solid (gap always jumpable)
      const pre = 120 + Math.random() * 80;
      platforms.push({ x: cursor, y: lastFloorY, w: pre, h: floorH });
      cursor += pre;

      const gap = 90 + Math.random() * (CFG.maxGap - 90) * (0.6 + difficulty * 0.4);
      cursor += gap; // empty air

      const post = 160 + Math.random() * 120;
      // slight height change
      if (Math.random() < 0.4) {
        lastFloorY = groundY - Math.floor(Math.random() * 3) * 28;
      }
      platforms.push({ x: cursor, y: lastFloorY, w: post, h: floorH });
      cursor += post;
    }
    else if (pattern === 'steps') {
      const dir = Math.random() < 0.5 ? -1 : 1;
      let y = lastFloorY;
      for (let i = 0; i < 3 + Math.floor(Math.random() * 2); i++) {
        const w = 90 + Math.random() * 70;
        platforms.push({ x: cursor, y: y, w: w, h: floorH });
        // occasional spike on step
        if (Math.random() < 0.25 + difficulty * 0.2 && i > 0) {
          spikes.push({ x: cursor + w * 0.3, y: y - 22, w: 28, h: 22 });
        }
        cursor += w + 8;
        y += dir * (24 + Math.random() * 16);
        y = Math.max(groundY - 110, Math.min(groundY, y));
      }
      lastFloorY = y;
    }
    else if (pattern === 'spikes') {
      const len = 260 + Math.random() * 140;
      platforms.push({ x: cursor, y: lastFloorY, w: len, h: floorH });
      // place 1–3 spikes with safe gaps between
      const count = 1 + Math.floor(Math.random() * 2 + difficulty);
      let sx = cursor + 50;
      for (let i = 0; i < count; i++) {
        spikes.push({ x: sx, y: lastFloorY - 24, w: 30, h: 24 });
        sx += 70 + Math.random() * 50;
        if (sx > cursor + len - 40) break;
      }
      cursor += len;
    }
    else { // mixed
      const pre = 100 + Math.random() * 60;
      platforms.push({ x: cursor, y: lastFloorY, w: pre, h: floorH });
      cursor += pre;
      const gap = 100 + Math.random() * 70;
      cursor += gap;
      lastFloorY = groundY - (Math.random() < 0.5 ? 0 : 36);
      const post = 140 + Math.random() * 80;
      platforms.push({ x: cursor, y: lastFloorY, w: post, h: floorH });
      if (Math.random() < 0.5) {
        spikes.push({ x: cursor + post * 0.4, y: lastFloorY - 24, w: 28, h: 24 });
      }
      cursor += post;
    }

    // safety: always end with some ground so next chunk connects
    if (cursor < endX - 40) {
      platforms.push({ x: cursor, y: lastFloorY, w: endX - cursor + 20, h: floorH });
    }

    nextChunkX = endX;
  }

  // --- Input ---
  function jump() {
    if (!running || dead) return;
    if (player.onGround) {
      player.vy = CFG.jumpVel;
      player.onGround = false;
      player.squish = 1.25;
      // jump particles
      for (let i = 0; i < 6; i++) {
        particles.push({
          x: player.x + camX + CFG.playerSize / 2,
          y: player.y + CFG.playerSize,
          vx: (Math.random() - 0.5) * 4,
          vy: Math.random() * -2,
          life: 20 + Math.random() * 15,
          size: 3 + Math.random() * 3
        });
      }
    }
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (!running) startGame();
      else jump();
    }
  });
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!running) startGame();
    else jump();
  });
  startBtn.addEventListener('click', startGame);

  // --- Game flow ---
  function startGame() {
    overlay.classList.add('hidden');
    hint.classList.add('hidden');
    running = true;
    dead = false;
    score = 0;
    player.y = groundY - CFG.playerSize;
    player.vy = 0;
    player.onGround = true;
    player.squish = 1;
    player.rot = 0;
    resetWorld();
    scoreEl.textContent = '0';
  }

  function die() {
    if (dead) return;
    dead = true;
    shake = 12;
    // death particles
    for (let i = 0; i < 18; i++) {
      particles.push({
        x: player.x + camX + CFG.playerSize / 2,
        y: player.y + CFG.playerSize / 2,
        vx: (Math.random() - 0.5) * 12,
        vy: (Math.random() - 0.5) * 12,
        life: 30 + Math.random() * 25,
        size: 4 + Math.random() * 5
      });
    }
    setTimeout(() => {
      attempts++;
      attemptsEl.textContent = attempts;
      running = false;
      dead = false;
      overlay.classList.remove('hidden');
      overlay.querySelector('h1').textContent = 'Упс!';
      overlay.querySelector('p').innerHTML = `Очки: <b>${score}</b><br>Попытка ${attempts}`;
      startBtn.textContent = 'ЕЩЁ РАЗ';
      hint.classList.remove('hidden');
    }, 650);
  }

  // --- Physics & collision ---
  function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  function update(dt) {
    if (!running || dead) {
      // still update particles
      particles = particles.filter(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
        return p.life > 0;
      });
      if (shake > 0) shake *= 0.85;
      return;
    }

    // scroll world
    camX += CFG.speed;
    score = Math.floor(camX / 10);
    scoreEl.textContent = score;

    // generate ahead
    while (nextChunkX < camX + W / devicePixelRatio + 800) {
      generateChunk();
    }

    // clean far behind
    const minX = camX - 400;
    platforms = platforms.filter(p => p.x + p.w > minX);
    spikes = spikes.filter(s => s.x + s.w > minX);

    // player physics
    player.vy += CFG.gravity;
    player.y += player.vy;

    // squash recovery
    player.squish += (1 - player.squish) * 0.15;
    if (!player.onGround) player.rot += 0.18;
    else player.rot = 0;

    // collisions with platforms
    player.onGround = false;
    const px = player.x + camX;
    const py = player.y;
    const ps = CFG.playerSize;

    for (const p of platforms) {
      if (aabb(px, py, ps, ps, p.x, p.y, p.w, p.h)) {
        // landing from above
        if (player.vy > 0 && py + ps - player.vy <= p.y + 8) {
          player.y = p.y - ps;
          player.vy = 0;
          player.onGround = true;
          player.squish = 0.75;
        }
        // hit ceiling / side — die if coming from side hard
        else if (player.vy <= 0 && py >= p.y + p.h - 10) {
          // ceiling
          player.y = p.y + p.h;
          player.vy = 0;
        } else {
          // side collision while moving → death-ish
          die();
          return;
        }
      }
    }

    // spikes
    for (const s of spikes) {
      if (aabb(px + 4, py + 4, ps - 8, ps - 8, s.x, s.y, s.w, s.h)) {
        die();
        return;
      }
    }

    // fell into void
    if (player.y > groundY + 200) {
      die();
      return;
    }

    // particles
    particles = particles.filter(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
      return p.life > 0;
    });

    if (shake > 0) shake *= 0.85;
  }

  // --- Draw ---
  function draw() {
    const viewW = window.innerWidth;
    const viewH = window.innerHeight;

    // camera shake
    const sx = (Math.random() - 0.5) * shake;
    const sy = (Math.random() - 0.5) * shake;
    ctx.save();
    ctx.translate(sx, sy);

    // background
    ctx.fillStyle = CFG.colors.bg;
    ctx.fillRect(0, 0, viewW, viewH);

    // subtle grid / stars
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    for (let i = 0; i < 40; i++) {
      const gx = ((i * 97 - camX * 0.15) % viewW + viewW) % viewW;
      const gy = (i * 53) % viewH;
      ctx.fillRect(gx, gy, 2, 2);
    }

    // platforms
    ctx.fillStyle = CFG.colors.platform;
    for (const p of platforms) {
      const sx = p.x - camX;
      if (sx + p.w < -20 || sx > viewW + 20) continue;
      ctx.fillRect(sx, p.y, p.w, Math.min(p.h, viewH - p.y + 20));
      // top edge highlight
      ctx.fillStyle = '#1a4a7a';
      ctx.fillRect(sx, p.y, p.w, 4);
      ctx.fillStyle = CFG.colors.platform;
    }

    // spikes (triangles)
    for (const s of spikes) {
      const sx = s.x - camX;
      if (sx + s.w < -10 || sx > viewW + 10) continue;
      ctx.fillStyle = CFG.colors.spike;
      ctx.beginPath();
      ctx.moveTo(sx, s.y + s.h);
      ctx.lineTo(sx + s.w / 2, s.y);
      ctx.lineTo(sx + s.w, s.y + s.h);
      ctx.closePath();
      ctx.fill();
    }

    // particles
    ctx.fillStyle = CFG.colors.particle;
    for (const p of particles) {
      const alpha = Math.min(1, p.life / 20);
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(p.x - camX, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // player
    if (!dead || particles.length > 5) {
      const px = player.x;
      const py = player.y;
      const ps = CFG.playerSize;
      ctx.save();
      ctx.translate(px + ps / 2, py + ps / 2);
      ctx.rotate(player.rot);
      ctx.scale(1 / player.squish, player.squish);
      // body
      ctx.fillStyle = CFG.colors.player;
      ctx.fillRect(-ps / 2, -ps / 2, ps, ps);
      // eyes
      ctx.fillStyle = CFG.colors.playerEye;
      ctx.fillRect(-10, -10, 8, 10);
      ctx.fillRect(2, -10, 8, 10);
      // pupils
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(-7, -7, 4, 5);
      ctx.fillRect(5, -7, 4, 5);
      ctx.restore();
    }

    // ground line hint (far)
    ctx.strokeStyle = 'rgba(233,69,96,0.15)';
    ctx.setLineDash([8, 12]);
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(viewW, groundY);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.restore();
  }

  // --- Loop ---
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(32, now - last);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // prevent scroll / bounce on mobile
  document.body.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
})();
</script>
</body>
</html>
