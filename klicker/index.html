<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a9d2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SUPR KLICKER">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>SUPR KLICKER</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%23ffd93b' stroke='%232a9d2a' stroke-width='7'/%3E%3Ccircle cx='36' cy='42' r='6' fill='%232a9d2a'/%3E%3Ccircle cx='64' cy='42' r='6' fill='%232a9d2a'/%3E%3Cpath d='M30 60 Q50 80 70 60' fill='none' stroke='%232a9d2a' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ===================== LOOK: green marker on notebook paper ===================== */
:root{ --paper:#fdfdf6; --ink:#2a9d2a; --grid:rgba(70,130,220,.17); --card:rgba(255,255,255,.82); --gold:#ffc928; --bad:#ff4d3d; }
body.t-blueprint{ --paper:#1d4e9e; --ink:#ffffff; --grid:rgba(255,255,255,.15); --card:rgba(255,255,255,.10); }
body.t-chalk{ --paper:#23452f; --ink:#f3efdf; --grid:rgba(255,255,255,.05); --card:rgba(255,255,255,.07); }
body.t-space{ --paper:#0f0b28; --ink:#cdbbff; --grid:rgba(255,255,255,.05); --card:rgba(255,255,255,.08); }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:"Comic Sans MS","Chalkboard SE","Marker Felt","Segoe Print",ui-rounded,system-ui,sans-serif;
  color:var(--ink); background-color:var(--paper); touch-action:manipulation;
  background-image:linear-gradient(var(--grid) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);
  background-size:26px 26px; transition:background-color .4s;
}
body.t-space{background-image:radial-gradient(#fff 1px,transparent 1.6px),radial-gradient(#b9a7ff 1px,transparent 1.4px);background-size:70px 70px,43px 43px;background-position:0 0,21px 30px}
body.disco{animation:disco 2.4s linear infinite}
@keyframes disco{to{filter:hue-rotate(360deg)}}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
#app{position:relative;height:100vh;height:100dvh;max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom))}
.screen{position:absolute;inset:0;padding:inherit;display:none;flex-direction:column;gap:10px}
.screen.on{display:flex}

.btn{
  font-weight:900;text-transform:uppercase;letter-spacing:1px;font-size:17px;line-height:1.1;
  background:var(--card);border:3.5px solid var(--ink);padding:10px 14px;
  border-radius:14px 5px 16px 6px/6px 16px 5px 14px;box-shadow:3px 4px 0 var(--ink);transition:transform .06s;white-space:nowrap;
}
.btn:nth-child(even){border-radius:6px 16px 5px 14px/14px 5px 16px 6px}
.btn:active{transform:translate(2px,3px) rotate(-1deg);box-shadow:1px 1px 0 var(--ink)}
.btn.big{font-size:23px;padding:12px 18px}
.btn.small{font-size:13px;padding:6px 10px;box-shadow:2px 3px 0 var(--ink)}
.btn.on{background:var(--ink);color:var(--paper)}
.btn.locked{opacity:.5}
.btn.gold{background:var(--gold);color:#5a3d00;border-color:#5a3d00;box-shadow:3px 4px 0 #5a3d00}
.frame{border:3.5px solid var(--ink);border-radius:18px 7px 20px 8px/8px 20px 7px 18px;background:var(--card)}
h1,h2{font-weight:900;text-transform:uppercase;letter-spacing:2px;line-height:1}
h2{font-size:min(6.4vw,26px)}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.bank{font-weight:900;font-size:20px;white-space:nowrap}
.bank small{font-size:.7em;opacity:.8}

/* ===================== CHARACTER ===================== */
.char{display:block;width:100%;height:100%;overflow:visible}
.char .rb{animation:disco 3s linear infinite}
.char .flame{animation:flame .18s infinite alternate;transform-origin:50% 0;transform-box:fill-box}
@keyframes flame{to{transform:scaleY(.6)}}
.idle{animation:idle 2.2s ease-in-out infinite}
.char .eyes{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
#gameFace .char{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.035) translateY(-1.5%)}}
.char.popin{animation:popin .25s}
@keyframes popin{0%{transform:scale(.8)}60%{transform:scale(1.08)}}
.screen.on{animation:screenIn .18s ease-out}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}}
.sp{position:absolute;width:11px;height:11px;border:3px solid var(--ink)}
@keyframes idle{50%{transform:translateY(-6px) rotate(-2deg)}}

/* ===================== MAIN MENU ===================== */
#s-menu{justify-content:center;gap:16px}
.title{text-align:center;font-size:min(13vw,62px);transform:rotate(-3deg);text-shadow:3px 3px 0 var(--gold)}
.title span{display:inline-block}
.title span:nth-child(odd){transform:rotate(4deg) translateY(-3px)}
.title span:nth-child(3n){transform:rotate(-6deg) translateY(3px)}
.menu-body{display:flex;align-items:center;justify-content:center;gap:14px}
.menu-btns{display:flex;flex-direction:column;gap:14px;align-items:stretch;min-width:170px}
.menu-btns .btn.big{font-size:min(4.9vw,22px);padding:12px 10px;letter-spacing:.5px}
.menu-face{width:min(42vw,220px);height:min(42vw,220px);flex:none}
.menu-foot{text-align:center;font-weight:900;font-size:15px;line-height:1.5}
.menu-foot i{font-style:normal;opacity:.7;font-size:12px}
.menu-tools{display:flex;gap:10px;justify-content:center}

/* ===================== GAME ===================== */
.counter{text-align:center;flex:none}
.counter b{display:block;font-size:min(10vw,44px);font-weight:900;line-height:1.05}
.counter b.bump{animation:bump .12s}
.counter span{font-size:14px;font-weight:900;opacity:.85}
@keyframes bump{50%{transform:scale(1.07)}}
.goal{flex:none;position:relative;height:22px;border:3px solid var(--ink);border-radius:12px 5px 12px 6px/6px 12px 5px 12px;background:var(--card);overflow:hidden}
.goal i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(-55deg,var(--ink) 0 5px,transparent 5px 9px);opacity:.75;transition:width .3s}
.goal span{position:absolute;inset:0;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:space-around;text-shadow:0 0 3px var(--paper),0 0 3px var(--paper)}
.arena{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#smiley{position:relative;width:min(60vw,46vh,290px);height:min(60vw,46vh,290px);touch-action:none;z-index:3;transition:transform .2s}
body.bighead #smiley{transform:scale(1.5)}
#smiley .face-wrap{position:absolute;inset:10%;transition:transform .05s}
#smiley.hit .face-wrap{transform:scale(.9)}
#smiley.warn .face-wrap{animation:tremble .08s infinite}
#smiley.angry .face-wrap{animation:tremble .06s infinite}
@keyframes tremble{0%{transform:translate(-3px,1px) rotate(-2deg)}100%{transform:translate(3px,-1px) rotate(2deg)}}
#smiley.party .face-wrap{animation:dance .35s ease-in-out infinite alternate}
@keyframes dance{from{transform:rotate(-9deg) scale(1.04)}to{transform:rotate(9deg) scale(1.1)}}
.rays{position:absolute;inset:-9%;animation:spin 14s linear infinite;pointer-events:none}
.rays line{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
#smiley.hit .rays line{stroke:var(--gold)}
#smiley.angry .rays line{stroke:var(--bad)}
#smiley.party .rays{animation-duration:2s}
#smiley.party .rays line{stroke:var(--gold);stroke-width:8}
@keyframes spin{to{transform:rotate(360deg)}}
.tap-hint{position:absolute;left:50%;top:1%;transform:translateX(-50%);font-size:30px;font-weight:900;text-align:center;line-height:.9;z-index:4;pointer-events:none;animation:hintbob .6s ease-in-out infinite alternate}
@keyframes hintbob{to{transform:translateX(-50%) translateY(10px)}}
.mood-msg{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);font-size:22px;font-weight:900;white-space:nowrap;z-index:5;pointer-events:none;background:var(--paper);border:3.5px solid currentColor;border-radius:12px 4px 12px 5px/5px 12px 4px 12px;padding:1px 12px}
.mood-msg:empty{display:none}
.mood-msg.bad{color:var(--bad);animation:bump .25s infinite}
.mood-msg.good{color:#e6a700;animation:bump .3s infinite}
.shape{position:absolute;width:46px;height:46px;margin:-23px;z-index:2;animation:floaty 3s ease-in-out infinite alternate;touch-action:none}
.shape svg{width:100%;height:100%;overflow:visible}
.shape svg *{fill:none;stroke:var(--ink);stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
.shape.gold{z-index:6;animation:goldpulse .35s ease-in-out infinite alternate}
.shape.gold svg *{fill:var(--gold);stroke:#b07800}
.shape.gold::after{content:"TAP!";position:absolute;left:50%;top:-16px;transform:translateX(-50%);font-size:12px;font-weight:900;color:#b07800;text-shadow:0 0 4px var(--paper)}
.shape.popped{animation:pop .3s}
@keyframes floaty{from{transform:translateY(-7px) rotate(-8deg)}to{transform:translateY(7px) rotate(8deg)}}
@keyframes goldpulse{from{transform:scale(1.15) rotate(-12deg)}to{transform:scale(1.5) rotate(12deg)}}
@keyframes pop{50%{transform:scale(1.5) rotate(40deg)}}
.hype{flex:none;display:flex;align-items:center;gap:8px;font-weight:900;font-size:13px}
.hype .track{flex:1;height:18px;border:3px solid var(--ink);border-radius:10px 4px 10px 5px/5px 10px 4px 10px;overflow:hidden;background:var(--card);position:relative}
.hype .track i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ffe45c,#ff9d1c,#ff3df2);transition:width .12s}
.hype.party .track i{animation:disco .8s linear infinite}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:24px;flex:none}
.badge{font-size:12px;font-weight:900;border:2.5px solid var(--ink);border-radius:10px;padding:1px 8px;background:var(--card)}
.badge.hot{background:var(--gold);color:#5a3d00;border-color:#5a3d00}
.bar-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none;font-weight:900;font-size:13px}
.bar-bottom div{flex:1;line-height:1.2}
.bar-bottom div:last-child{text-align:right}
.shake{animation:shake .3s}
@keyframes shake{20%{transform:translate(-7px,2px)}40%{transform:translate(7px,-2px)}60%{transform:translate(-5px,0)}80%{transform:translate(5px,1px)}}

/* ===================== SHOP / WARDROBE / CHEATS ===================== */
.tabs{display:flex;gap:8px;flex:none}
.tabs .btn{flex:1;font-size:15px;padding:8px 4px}
.scroll{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:4px 6px 14px 2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.set-head{grid-column:1/-1;font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:1px;border-bottom:3px dashed var(--ink);padding:6px 2px 4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px 10px;text-align:center;box-shadow:3px 4px 0 var(--ink);font-weight:900}
.card:nth-child(odd){border-radius:8px 20px 7px 18px/18px 7px 20px 8px}
.card:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.card .pic{width:74px;height:74px}
.card .pic.emo{font-size:46px;line-height:74px}
.card .nm{font-size:14px;text-transform:uppercase}
.card .fx{font-size:12px;opacity:.85;min-height:15px}
.card .pr{font-size:15px;margin-top:2px;border:2.5px solid var(--ink);border-radius:9px;padding:1px 10px}
.card.cant .pr{opacity:.45;border-style:dashed}
.card.own{background:transparent;box-shadow:none;border-style:dashed}
.card.own .pr{border:none;opacity:.8}
.card.worn .pr{background:var(--ink);color:var(--paper);opacity:1;border-radius:9px}
.ward{flex:1;min-height:0;display:flex;gap:10px}
.ward .list{flex:1.25;min-width:0;display:flex;flex-direction:column}
.ward .side{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.ward .preview{width:100%;max-width:210px;aspect-ratio:1}
.ward .mult{font-weight:900;font-size:20px;text-align:center;line-height:1.1}
.ward .sets{font-size:12px;font-weight:900;line-height:1.5;text-align:center}
.slot-h{font-size:12px;font-weight:900;letter-spacing:1px;margin:8px 0 4px;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:900;border:2.5px solid var(--ink);border-radius:10px 4px 10px 4px;padding:5px 8px;background:var(--card)}
.chip.on{background:var(--ink);color:var(--paper)}
.rowc{display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:10px;font-weight:900}
.rowc .ic{font-size:30px;width:38px;text-align:center;flex:none}
.rowc .tx{flex:1;min-width:0;font-size:12.5px;line-height:1.25}
.rowc .tx b{display:block;font-size:15px;text-transform:uppercase}

/* ===================== OVERLAYS, TOASTS, FX ===================== */
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(128,128,128,.55);background:color-mix(in srgb,var(--paper) 82%,transparent)}
.overlay.on{display:flex}
.box{width:100%;max-width:340px;padding:18px 16px;display:flex;flex-direction:column;gap:13px;align-items:stretch;text-align:center;background:var(--paper);box-shadow:5px 6px 0 var(--ink);max-height:92vh;overflow-y:auto}
.box p{font-weight:900;font-size:15px;line-height:1.35}
.box .bigface{width:130px;height:130px;margin:0 auto}
#toasts{position:fixed;left:0;right:0;top:calc(150px + env(safe-area-inset-top));z-index:80;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);font-weight:900;font-size:14px;padding:7px 14px;border-radius:12px 4px 12px 4px;max-width:88vw;text-align:center;animation:toast 2.6s forwards}
@keyframes toast{0%{opacity:0;transform:translateY(-10px) rotate(-2deg)}8%,85%{opacity:1;transform:none}100%{opacity:0}}
#fx{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
.fl{position:absolute;font-weight:900;font-size:24px;white-space:nowrap;transform:translate(-50%,-50%);text-shadow:0 0 5px var(--paper),0 0 5px var(--paper)}
.fl.bad{color:var(--bad);font-size:30px}
.fl.gold{color:#e6a700;font-size:30px}
.fl.sm{font-size:16px;opacity:.8}
.cf{position:absolute;top:-24px;width:14px;height:14px}
</style>
</head>
<body>
<div id="app">

  <!-- MAIN MENU -->
  <section class="screen" id="s-menu">
    <h1 class="title" id="title"></h1>
    <div class="menu-body">
      <div class="menu-btns">
        <button class="btn big" data-go="game">Start</button>
        <button class="btn big" data-go="shop">Shop</button>
        <button class="btn big" data-go="ward">Accessories</button>
        <button class="btn big" id="cheatBtn" data-go="cheats">🔒 Cheats</button>
      </div>
      <div class="menu-face idle" id="menuFace"></div>
    </div>
    <div class="menu-foot"><span id="menuBank"></span><br><i>Game idea &amp; design: Anton</i></div>
    <div class="menu-tools"><button class="btn small" id="musBtn" data-music>♪ Music: OFF</button><button class="btn small" id="instBtn">📲 Install</button></div>
  </section>

  <!-- GAME -->
  <section class="screen" id="s-game">
    <div class="bar-top">
      <button class="btn" data-go="shop">Shop</button>
      <button class="btn small" data-go="ward">Accessories</button>
      <button class="btn" id="pauseBtn">Pause</button>
    </div>
    <div class="counter"><b id="bank">Ð 0</b><span id="perTap"></span></div>
    <div class="goal"><i id="goalFill"></i><span><u></u><u>1K</u><u>1M</u><u>GOAL: 1 BILLION</u></span></div>
    <div class="arena" id="arena">
      <div class="tap-hint" id="tapHint">TAP!<br>↓</div>
      <button id="smiley" aria-label="Tap the smiley">
        <svg class="rays" viewBox="-100 -100 200 200" id="rays"></svg>
        <div class="face-wrap" id="gameFace"></div>
      </button>
      <div class="mood-msg" id="moodMsg"></div>
    </div>
    <div class="badges" id="badges"></div>
    <div class="hype" id="hype"><span id="hypeLbl">HYPE</span><div class="track"><i id="hypeFill"></i></div><span id="hypeX">×2</span></div>
    <div class="bar-bottom">
      <div id="statL"></div>
      <button class="btn" id="menuBtn">Menu</button>
      <div id="statR"></div>
    </div>
  </section>

  <!-- SHOP -->
  <section class="screen" id="s-shop">
    <div class="bar-top"><button class="btn" data-back>← Back</button><h2>Shop</h2><div class="bank" id="shopBank"></div></div>
    <div class="tabs" id="shopTabs">
      <button class="btn" data-tab="gear">Gear</button>
      <button class="btn" data-tab="style">Style</button>
      <button class="btn" data-tab="power">Power</button>
    </div>
    <div class="scroll"><div class="grid" id="shopGrid"></div></div>
  </section>

  <!-- ACCESSORIES (wardrobe) -->
  <section class="screen" id="s-ward">
    <div class="bar-top"><button class="btn" data-back>← Back</button><h2>Accessories</h2><span style="width:8px"></span></div>
    <div class="ward">
      <div class="list frame"><div class="scroll" id="wardList" style="padding:4px 10px 12px"></div></div>
      <div class="side">
        <div class="preview idle" id="wardFace"></div>
        <div class="mult" id="wardMult"></div>
        <div class="sets" id="wardSets"></div>
        <button class="btn small" id="bestBtn">Best outfit</button>
      </div>
    </div>
  </section>

  <!-- CHEATS -->
  <section class="screen" id="s-cheats">
    <div class="bar-top"><button class="btn" data-back>← Back</button><h2>Cheats</h2><div class="bank" id="cheatBank"></div></div>
    <div class="scroll" id="cheatList"></div>
  </section>
</div>

<!-- shared colour gradients for the gold and rainbow skins -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3a6"/><stop offset=".5" stop-color="#ffcf2e"/><stop offset="1" stop-color="#e09a00"/></linearGradient>
  <linearGradient id="gRain" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5f6d"/><stop offset=".25" stop-color="#ffc371"/><stop offset=".5" stop-color="#7bed9f"/><stop offset=".75" stop-color="#70a1ff"/><stop offset="1" stop-color="#c56cf0"/></linearGradient>
</defs></svg>

<div class="overlay" id="overlay"><div class="box frame" id="box"></div></div>
<div id="fx"></div>
<div id="toasts"></div>

<script>
'use strict';
/* =====================================================================
   SUPR KLICKER — game idea & design: Anton
   Tap the smiley, earn DigiBucks (Ð), dress up, reach ONE BILLION.
   ===================================================================== */
const SAVE_KEY = 'suprKlickerSave1';
const GOAL = 1e9;

/* ---------- GEAR SETS: every piece multiplies your taps, a full set multiplies even more ---------- */
const SETS = {
  street: { name: 'Street',    piece: 1.25, perk: 'HYPE bar fills faster' },
  pirate: { name: 'Pirate',    piece: 1.6,  perk: 'Golden shapes are twice as good' },
  gent:   { name: 'Gentleman', piece: 2,    perk: 'Angry taps cost only half' },
  ninja:  { name: 'Ninja',     piece: 2.5,  perk: 'Longer warning before he gets angry' },
  cyber:  { name: 'Cyber',     piece: 3.2,  perk: 'Robo-fingers work twice as fast' },
  wizard: { name: 'Wizard',    piece: 4,    perk: 'Party time lasts 12 seconds' },
  royal:  { name: 'Royal',     piece: 5,    perk: 'Party time pays ×3' },
};
// Wearing pieces of ONE set together gives an extra bonus: 2 pieces, 3 pieces, full set.
// Balanced so that every new piece you buy makes you stronger than before.
const SET_BONUS = { 2: 1.15, 3: 1.35, 4: 1.6 };
const GEAR_SLOTS = ['head', 'eyes', 'hands', 'feet'];
const SLOT_NAME = { head: 'Head', eyes: 'Eyes', hands: 'Hands', feet: 'Feet', skin: 'Skin', extra: 'Face', neck: 'Neck', paper: 'Paper' };

const G = (id, set, slot, name, price) => ({ id, set, slot, name, price, gear: true });
const C = (id, slot, name, price) => ({ id, slot, name, price });
const ITEMS = [
  G('cap',      'street', 'head',  'Cool Cap',        1500),
  G('shades',   'street', 'eyes',  'Dark Shades',     5000),
  G('bands',    'street', 'hands', 'Sweatbands',      12000),
  G('sneakers', 'street', 'feet',  'Fast Sneakers',   30000),
  G('patch',    'pirate', 'eyes',  'Eye Patch',       75000),
  G('pboots',   'pirate', 'feet',  'Pirate Boots',    120000),
  G('hooks',    'pirate', 'hands', 'Hook Hands',      170000),

  n = Math.floor(n);

  if (n < 1e4) return n.toLocaleString('en-US');
  if (n < 1e6) return cut(n / 1e3, 'K');
  if (n < 1e9) return cut(n / 1e6, 'M');
  if (n < 1e12) return cut(n / 1e9, 'B');
  return cut(n / 1e12, 'T');
}

function useCheat(id) {
  if (id === 'billion') { add(1e9); toast('💰 +1,000,000,000'); confetti(30); SFX.gold(); }
  else if (id === 'unlock') { ITEMS.forEach(it => { S.owned[it.id] = 1; }); const b = bestOutfit(); GEAR_SLOTS.forEach(s => { S.eq[s] = b[s]; }); toast('🗝️ Everything is yours! Check your accessories'); confetti(30); SFX.gold(); }
  else { S.cheats[id] = !S.cheats[id]; SFX.click(); if (id === 'zen' && S.cheats.zen && (mood === 'angry' || mood === 'warn')) setMood('happy'); }
  applyLook(); save(); renderCheats();
}

/* ---------- pop-up boxes: pause, menu, settings, win ---------- */
function openBox(html, name) { overlay = name; $('box').innerHTML = html; $('overlay').classList.add('on'); }
function closeBox() { overlay = null; $('overlay').classList.remove('on'); }
function showPause() { openBox(`<div class="bigface idle">${charSVG(S.eq, 'sleep')}</div><h2>Paused</h2><button class="btn big" data-act="close">Resume</button>`, 'pause'); }
function showMenu() {
  openBox(`<h2>Menu</h2><button class="btn big" data-act="close">Resume</button><button class="btn big" data-act="save">Save</button><button class="btn big" data-act="settings">Settings</button><button class="btn big" data-act="exit">Exit</button>`, 'menu');
}
function showSettings() {
  openBox(`<h2>Settings</h2><button class="btn big${S.sound ? ' on' : ''}" data-act="sound">Sound: ${S.sound ? 'ON' : 'OFF'}</button>
    <button class="btn big${S.music ? ' on' : ''}" data-act="music" data-music>♪ Music: ${S.music ? 'ON' : 'OFF'}</button>
    ${standalone() ? '' : '<button class="btn" data-act="install">📲 Install app</button>'}
    <button class="btn" data-act="reset">Reset game</button>
    <p style="font-size:12px;opacity:.75">The game also saves by itself every few seconds.<br>SUPR KLICKER · game idea &amp; design: Anton</p>
    <button class="btn big" data-act="menu">← Back</button>`, 'settings');
}
/* ---------- install as an app (PWA) ---------- */
const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
window.addEventListener('appinstalled', () => { installEvt = null; toast('📲 Installed! Look for the smiley icon'); });
function install() {
  if (installEvt) { installEvt.prompt(); installEvt.userChoice.then(() => { installEvt = null; }); return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  openBox(`<h2>Install</h2>` + (ios
    ? '<p>1. Open the game in Safari<br>2. Tap the Share button<br>3. Choose “Add to Home Screen”</p>'
    : '<p>1. Open the game in Chrome<br>2. Tap the ⋮ menu<br>3. Choose “Install app” or “Add to Home screen”</p>') +
    '<p style="font-size:12px;opacity:.75">Then the game gets its own icon and works without internet.</p><button class="btn big" data-act="close">OK</button>', 'install');
}
function boxAction(act) {
  SFX.click();
  if (act === 'close') closeBox();
  else if (act === 'save') { save(); toast('💾 Game saved!'); }
  else if (act === 'settings') showSettings();
  else if (act === 'menu') showMenu();
  else if (act === 'exit') { save(); closeBox(); go('menu'); }
  else if (act === 'sound') { S.sound = !S.sound; save(); showSettings(); }
  else if (act === 'music') setMusic(!S.music);
  else if (act === 'install') install();
  else if (act === 'reset') openBox(`<h2>Reset?</h2><p>Everything will be erased: DigiBucks, items, cheats. This can't be undone!</p><button class="btn big" data-act="settings">No, keep it</button><button class="btn" data-act="reset2">Yes, erase all</button>`, 'reset');
  else if (act === 'reset2') { const snd = S.sound, mus = S.music; S = fresh(); S.sound = snd; S.music = mus; hype = 0; shield = false; turbo = 0; mood = 'happy'; nextAngry = rnd(14, 20); save(); applyLook(); closeBox(); $('tapHint').style.display = ''; go('menu'); toast('Fresh start!'); }
}

/* =====================================================================
   START
   ===================================================================== */
function boot() {
  load(); applyLook();
  wantMusic = !!S.music; S.music = false;
  $('title').innerHTML = 'SUPR KLICKER'.split('').map(ch => ch === ' ' ? '<br>' : `<span>${ch}</span>`).join('');
  // rays around the smiley
  let rays = '';
  for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2, r1 = 76, r2 = i % 2 ? 96 : 90; rays += `<line x1="${(Math.cos(a) * r1).toFixed(1)}" y1="${(Math.sin(a) * r1).toFixed(1)}" x2="${(Math.cos(a) * r2).toFixed(1)}" y2="${(Math.sin(a) * r2).toFixed(1)}"/>`; }
  $('rays').innerHTML = rays;
  // shapes
  SHAPES.forEach((s, i) => {
    const el = document.createElement('button');
    el.className = 'shape'; el.style.left = s[1] + '%'; el.style.top = s[2] + '%'; el.style.animationDelay = (-i * 0.37) + 's'; el.style.animationDuration = (2.4 + (i % 4) * 0.5) + 's';
    el.innerHTML = SHAPE_SVG[s[0]];
    el.addEventListener('pointerdown', e => { e.preventDefault(); tapShape(i, el); });
    $('arena').appendChild(el);
  });
  if (S.clicks >= 12) $('tapHint').style.display = 'none';

  $('smiley').addEventListener('pointerdown', e => { e.preventDefault(); if (screen === 'game' && !overlay) tapSmiley(e.clientX, e.clientY); });
  $('smiley').addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat && screen === 'game' && !overlay) { e.preventDefault(); const r = $('smiley').getBoundingClientRect(); tapSmiley(r.left + r.width / 2 + rnd(-40, 40), r.top + r.height * 0.3); }
    if (e.code === 'Escape' && screen === 'game') { if (overlay) closeBox(); else showMenu(); }
  });
  document.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.go) { SFX.click(); go(t.dataset.go); }
    else if (t.dataset.back !== undefined) { SFX.click(); go(backTo); }
    else if (t.dataset.tab) { SFX.click(); shopTab = t.dataset.tab; renderShop(); document.querySelector('#s-shop .scroll').scrollTop = 0; }
    else if (t.dataset.item) buyItem(t.dataset.item);
    else if (t.dataset.power) buyPower(t.dataset.power);
    else if (t.dataset.wear) { toggleWear(t.dataset.wear); renderWard(); }
    else if (t.dataset.none) { S.eq[t.dataset.none] = null; SFX.click(); applyLook(); save(); renderWard(); }
    else if (t.dataset.cheat) useCheat(t.dataset.cheat);
    else if (t.dataset.act) boxAction(t.dataset.act);
    else if (t.id === 'musBtn') setMusic(!S.music);
    else if (t.id === 'instBtn') install();
    else if (t.id === 'pauseBtn') { SFX.click(); showPause(); }
    else if (t.id === 'menuBtn') { SFX.click(); showMenu(); }
    else if (t.id === 'bestBtn') { const b = bestOutfit(); GEAR_SLOTS.forEach(s => { S.eq[s] = b[s]; }); refreshPerks(); SFX.buy(); save(); renderWard(); toast('Best outfit on! Tap power ' + xm(gearMult(S.eq))); }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { save(); player.pause(); }
    else { if (S.music) player.play().catch(() => {}); welcomeBack(); }
  });
  // browsers only allow sound after a touch — that is when the music comes back
  window.addEventListener('pointerdown', e => { if (wantMusic && !e.target.closest('[data-music]')) setMusic(true); }, true);
  window.addEventListener('pagehide', save);

  go('menu'); musicUI();
  if (standalone()) $('instBtn').style.display = 'none';
  welcomeBack();
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(() => {});
  let last = performance.now(), saveClock = 0;
  setInterval(() => {
    const now = performance.now(), dt = Math.min(0.25, (now - last) / 1000); last = now;
    if (screen === 'game' && !overlay && !document.hidden) { tick(dt); renderGame(); }
    saveClock += dt; if (saveClock > 8) { saveClock = 0; save(); }
  }, 100);
}
boot();
</script>
</body>
</html>
