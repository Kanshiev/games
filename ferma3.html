<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f9a2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ферма Антоши">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="ferma3.webmanifest">
<link rel="icon" type="image/png" href="ferma3-icon-192.png">
<link rel="apple-touch-icon" href="ferma3-icon-192.png">
<title>Ферма Антоши 3</title>
<style>
/* ============ ОСНОВА ============ */
:root{
  --wood:#8a5a2b; --wood-d:#5e3a17; --cream:#fff6dc; --cream-d:#f1e2b4;
  --green:#63b233; --green-d:#3f8a1c; --gold:#ffc93c; --red:#e5484d; --blue:#3fa9f5; --ink:#4a2f14;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",Roboto,Arial,sans-serif;
  color:var(--ink); background:#7cc04b url('ferma3-bg.webp') center/cover no-repeat; touch-action:manipulation;
}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
#app{
  position:relative; height:100vh; height:100dvh; max-width:500px; margin:0 auto;
  display:flex; flex-direction:column; gap:6px;
  padding:calc(6px + env(safe-area-inset-top)) 8px calc(6px + env(safe-area-inset-bottom));
}
.card{background:var(--cream);border:2px solid var(--wood);border-radius:14px;box-shadow:0 3px 0 var(--wood-d)}

/* ============ ВЕРХНЯЯ ПАНЕЛЬ ============ */
.hud{display:flex;gap:6px;align-items:stretch;flex:none}
.lvl{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:3px 8px 3px 4px}
.star{position:relative;width:34px;height:34px;flex:none;display:grid;place-items:center;font-size:30px;line-height:1}
.star b{position:absolute;left:0;right:0;top:11px;text-align:center;font-size:13px;font-weight:900;color:#6b3f00}
.xp{flex:1;height:16px;background:#e6d6a8;border-radius:8px;position:relative;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.xp i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#a8ec6a,#5cb82f);border-radius:8px;transition:width .35s}
.xp span{position:absolute;inset:0;font-size:10px;font-weight:800;text-align:center;line-height:16px;color:#3b2a0a}
.pill{padding:0 9px;min-height:42px;display:flex;align-items:center;gap:4px;font-weight:900;font-size:16px;white-space:nowrap}
.pill.water{color:#1769aa}
.ibtn{width:42px;font-size:20px;display:grid;place-items:center}
.ibtn:active,.nav button:active,.areas button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-d)}
.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.12)}}

/* ============ ПОГОДА / РЫНОК / ЗАКАЗЫ ============ */
.info{display:flex;gap:6px;flex:none}
.chip{background:rgba(255,246,220,.94);border:2px solid var(--wood);border-radius:12px;padding:3px 8px;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:26px;display:flex;align-items:center;gap:4px}
.chip.wx{flex:1}
.chip.hot{background:#ffe9c7;border-color:#e2711d;color:#a23b00}
.chip.wx.storm{background:#d7dcec;border-color:#4b5578}
.chip.wx.rain{background:#dbeeff;border-color:#3d7fb8}
.chip.wx.heat{background:#ffe1b8;border-color:#d9630b}
.chip.wx.rainbow{background:linear-gradient(90deg,#ffd6d6,#fff3c4,#d7f7d0,#d3ecff,#ecd9ff)}
.orders{display:flex;gap:6px;flex:none}
.ord{flex:1;min-width:0;height:42px;border-radius:12px;border:2px solid var(--wood);background:rgba(255,246,220,.94);padding:2px 6px;display:flex;align-items:center;gap:5px;text-align:left;box-shadow:0 2px 0 var(--wood-d)}
.ord .who{font-size:22px;flex:none}
.ord .tx{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.15}
.ord .need{font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord .rw{font-size:10.5px;font-weight:800;color:#9a6a00;white-space:nowrap}
.ord.wait{justify-content:center;font-size:12px;font-weight:800;color:#9c8560;background:rgba(255,246,220,.7);box-shadow:none;border-style:dashed}
.ord.done{background:#d9f7c1;border-color:var(--green-d);animation:pulse 1s infinite}
.ord.done .rw{color:#1f6b00}
@keyframes pulse{50%{transform:scale(1.04)}}

/* ============ ВКЛАДКИ УЧАСТКОВ ============ */
.areas{display:flex;gap:5px;flex:none}
.areas button{flex:1;min-width:0;height:34px;border-radius:12px 12px 6px 6px;border:2px solid var(--wood);background:#e9d9a8;font-size:12px;font-weight:800;position:relative;box-shadow:0 2px 0 var(--wood-d);white-space:nowrap;overflow:visible}
.areas button.on{background:var(--green);color:#fff;border-color:var(--green-d);box-shadow:0 2px 0 #2c6410;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.areas button.lock{background:#cfc6ad;color:#7b6f58}
.areas button.buyable{background:#ffe08a;animation:pulse 1.2s infinite}
.areas .dot{position:absolute;top:-7px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--green-d);color:#fff;font-size:10px;line-height:17px;padding:0 4px;border:1.5px solid #fff;text-shadow:none}
.areas .dot.pest{background:var(--red);right:auto;left:-3px;animation:pulse .6s infinite}

/* ============ ПОЛЕ ============ */
.field-wrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.field-box{position:relative;width:100%;height:100%;max-height:min(84vw,420px)}
.field{
  position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);gap:5px;padding:7px;
  background:linear-gradient(#a8743c,#8a5a2b);border:3px solid var(--wood-d);border-radius:18px;
  box-shadow:0 5px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.25); touch-action:none;
}
.field.indoor{background:linear-gradient(#bfe6f2,#8fc7d8);border-color:#4f8ea3}
.field.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
.plot{position:relative;border-radius:11px;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;overflow:visible;cursor:pointer}
.plot.soil{
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.10) 0 2px,transparent 2px 9px),radial-gradient(circle at 50% 35%,#8b5a34,#6b4226);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.14);
}
.plot.soil.wet{background:repeating-linear-gradient(180deg,rgba(0,0,0,.14) 0 2px,transparent 2px 9px),radial-gradient(circle at 50% 35%,#5e4634,#3f2c1f)}
.plot.wild{background:linear-gradient(#86cf52,#5aa832);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.3);opacity:.92}
.plot.wild .em{filter:saturate(.8);opacity:.85;font-size:min(6.4vw,30px)}
.plot.wild.can{box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 0 0 2px var(--gold)}
.plot.wild.can .em{opacity:1}
.plot.ready{box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),0 0 0 2.5px #b6f36a,0 0 10px 2px rgba(182,243,106,.8)}
.plot.gold{box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),0 0 0 2.5px var(--gold),0 0 14px 4px rgba(255,201,60,.95)}
.plot.rm{outline:2px dashed var(--red);outline-offset:-3px}
.em{font-size:min(8vw,38px);line-height:1;pointer-events:none;transform-origin:50% 90%;display:block}
.em.ghost{opacity:.28;transform:scale(.8)}
.em.s0{transform:scale(.5);animation:sprout .35s}
.em.s1{transform:scale(.72);animation:sprout .35s}
.em.s2{transform:scale(.8);filter:saturate(.55) brightness(.92);animation:sprout .35s}
.em.ripe{animation:ripe 1s ease-in-out infinite}
.em.tree{animation:sway 3.2s ease-in-out infinite}
.em.animal{animation:idle 1.6s ease-in-out infinite}
@keyframes sprout{0%{transform:scale(.2)}70%{transform:scale(.95)}}
@keyframes ripe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10%) scale(1.08)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%) rotate(-3deg)}}
.badge{position:absolute;right:-2px;bottom:6px;font-size:min(5.2vw,24px);line-height:1;pointer-events:none;animation:ripe .9s ease-in-out infinite;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));z-index:2;white-space:nowrap}
.badge small{font-size:10px;font-weight:900;color:#fff;background:var(--green-d);border-radius:8px;padding:0 4px;margin-left:-6px;vertical-align:top}
.spark{position:absolute;top:0;left:2px;font-size:13px;pointer-events:none;animation:twinkle .8s infinite alternate;z-index:3}
@keyframes twinkle{from{opacity:.3;transform:scale(.7) rotate(-20deg)}to{opacity:1;transform:scale(1.15) rotate(15deg)}}
.tag{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;font-size:9.5px;font-weight:900;color:#fff;background:rgba(0,0,0,.55);padding:0 4px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:2;line-height:13px}
.tag.price{bottom:3px;background:rgba(40,70,10,.75);color:#fff7c2}
.plot.wild:not(.can) .tag.price{color:#d9e6c3;background:rgba(40,70,10,.5)}
.bar{position:absolute;left:5px;right:5px;bottom:2px;height:4px;border-radius:3px;background:rgba(0,0,0,.45);overflow:hidden;pointer-events:none}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#b9f26b,#ffe45c);border-radius:3px}
.drop{position:absolute;top:1px;right:2px;font-size:11px;pointer-events:none;animation:twinkle 1s infinite alternate}
.pest{position:absolute;inset:0;display:grid;place-items:center;font-size:min(7vw,32px);z-index:4;pointer-events:none;animation:wiggle .35s infinite alternate;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.pest small{position:absolute;top:0;right:0;background:var(--red);color:#fff;font-size:10px;font-weight:900;border-radius:8px;padding:0 5px;border:1.5px solid #fff}
.pest i{position:absolute;left:5px;right:5px;top:3px;height:3px;border-radius:2px;background:rgba(0,0,0,.4);overflow:hidden}
.pest i b{display:block;height:100%;background:var(--red)}
@keyframes wiggle{from{transform:rotate(-9deg) scale(1)}to{transform:rotate(9deg) scale(1.1)}}
.burn{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;pointer-events:none;animation:fade 2.5s forwards;z-index:3}
@keyframes fade{to{opacity:0;transform:scale(1.6)}}
.pop{animation:pop .22s}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}}

/* погода поверх поля */
.wx-layer{position:absolute;inset:0;border-radius:18px;pointer-events:none;overflow:hidden;z-index:5}
.wx-layer.rain,.wx-layer.storm{
  background-image:linear-gradient(100deg,transparent 46%,rgba(210,235,255,.7) 48%,transparent 52%),linear-gradient(100deg,transparent 46%,rgba(210,235,255,.45) 48%,transparent 52%);
  background-size:26px 46px,38px 70px; animation:rain .5s linear infinite;
}
.wx-layer.storm{background-color:rgba(20,25,60,.28)}
.wx-layer.rain{background-color:rgba(40,80,140,.12)}
@keyframes rain{to{background-position:-10px 46px,-14px 70px}}
.wx-layer.heat{background:radial-gradient(circle at 85% 0%,rgba(255,190,40,.55),rgba(255,120,0,.12) 55%,transparent 75%);animation:heat 2s ease-in-out infinite alternate}
@keyframes heat{to{opacity:.6}}
.wx-layer.rainbow::before{content:"🌈";position:absolute;top:-6px;left:0;right:0;text-align:center;font-size:100px;line-height:1;opacity:.3}
.wx-layer.flash{animation:flash .5s}
@keyframes flash{0%,40%{background-color:rgba(255,255,255,.95)}20%{background-color:rgba(255,255,255,.2)}100%{background-color:rgba(20,25,60,.28)}}

.sprite{position:absolute;left:0;top:0;font-size:30px;line-height:1;z-index:6;pointer-events:none;transition:transform .35s cubic-bezier(.3,1.4,.6,1);display:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.45))}
.sprite.on{display:block}
.sprite span{display:block}
.sprite.hop span{animation:hop .35s}
@keyframes hop{50%{transform:translateY(-14px) rotate(-8deg)}}
.combo{position:absolute;top:-10px;right:6px;z-index:8;background:linear-gradient(#ff9f1c,#f3541d);color:#fff;font-weight:900;font-size:14px;padding:3px 10px;border-radius:14px;border:2px solid #fff;box-shadow:0 3px 6px rgba(0,0,0,.35);pointer-events:none;display:none}
.combo.on{display:block;animation:pop .2s}
.hint{position:absolute;left:50%;top:-12px;transform:translateX(-50%);z-index:9;max-width:92%;background:#fffbe9;border:2px solid #e2a100;border-radius:14px;padding:6px 12px;font-size:13.5px;font-weight:800;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.3);pointer-events:none;display:none;animation:bob 1.2s ease-in-out infinite}
.hint.on{display:block}
@keyframes bob{50%{transform:translateX(-50%) translateY(4px)}}
.gift{position:absolute;left:-60px;top:20%;z-index:10;font-size:38px;line-height:1;cursor:pointer;animation:fly 12s linear forwards;filter:drop-shadow(0 4px 3px rgba(0,0,0,.35));padding:8px}
.gift span{display:block;animation:bobg 1.4s ease-in-out infinite}
.gift small{display:block;font-size:20px;margin-top:-8px;text-align:center}
@keyframes fly{to{left:105%}}
@keyframes bobg{50%{transform:translateY(-14px) rotate(6deg)}}

/* ============ БУСТЫ / СОВЕТЫ ============ */
.boosts{flex:none;min-height:24px;display:flex;gap:5px;align-items:center;justify-content:center;flex-wrap:nowrap;overflow:hidden}
.bb{background:rgba(255,246,220,.95);border:2px solid var(--wood);border-radius:10px;padding:1px 7px;font-size:11.5px;font-weight:800;white-space:nowrap}
.bb.low{border-color:var(--red);color:var(--red);animation:pulse .7s infinite}
.tip{background:rgba(255,246,220,.85);border-radius:10px;padding:2px 10px;font-size:11.5px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ============ СЕМЕНА ============ */
.seeds{flex:none;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:3px 2px 5px;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch}
.seeds::-webkit-scrollbar{display:none}
.seed{flex:none;width:76px;height:66px;border-radius:14px;border:2px solid var(--wood);background:var(--cream);box-shadow:0 3px 0 var(--wood-d);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;position:relative}
.seed .e{font-size:24px;line-height:1.05}
.seed .n{font-size:10.5px;font-weight:800;white-space:nowrap;max-width:72px;overflow:hidden;text-overflow:ellipsis}
.seed .c{font-size:10.5px;font-weight:800;color:#8a6500;white-space:nowrap}
.seed .c u{text-decoration:none;color:#2f7d0c}
.seed.sel{background:#d9f7c1;border-color:var(--green-d);box-shadow:0 3px 0 #2c6410;transform:translateY(-3px)}
.seed.cant .c{color:var(--red)}
.seed.cant .e{filter:grayscale(.6);opacity:.7}
.seed.lock{background:#ddd3b8;color:#8b7e63;box-shadow:none}
.seed.lock .e{filter:grayscale(1);opacity:.5}
.seed.tool{width:54px;background:#f6d9c8}
.seed.tool.sel{background:#ffb4a8;border-color:var(--red);box-shadow:0 3px 0 #9a1f24}
.seed .hotf{position:absolute;top:-5px;right:-4px;font-size:14px}

/* ============ НИЖНЕЕ МЕНЮ ============ */
.nav{flex:none;display:flex;gap:6px}
.nav button{flex:1;height:50px;border-radius:14px;border:2px solid var(--wood);background:linear-gradient(#ffd98a,#ffb648);box-shadow:0 3px 0 var(--wood-d);font-size:11px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.nav button span{font-size:20px;line-height:1}
.nav .dot{position:absolute;top:-6px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;padding:0 4px;border:1.5px solid #fff;display:none}
.nav .dot.on{display:block}

/* ============ ВСПЛЫВАЮЩЕЕ ============ */
#fx{position:fixed;inset:0;pointer-events:none;z-index:900;overflow:hidden}
.ft{position:absolute;font-weight:900;font-size:16px;color:#fff;text-shadow:0 1px 0 #000,0 0 4px rgba(0,0,0,.8);white-space:nowrap;transform:translate(-50%,-50%)}
.ft.gold{color:var(--gold);font-size:20px}
.ft.xp{color:#b8f5ff;font-size:13px}
.ft.bad{color:#ff8f8f}
.pt{position:absolute;font-size:18px;line-height:1;transform:translate(-50%,-50%)}
.cf{position:absolute;width:9px;height:14px;top:-20px;border-radius:2px}
#toasts{position:fixed;left:0;right:0;top:calc(58px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:5px;z-index:950;pointer-events:none}
.toast{background:rgba(50,30,10,.93);color:#fff;font-weight:800;font-size:13.5px;padding:7px 14px;border-radius:14px;max-width:88vw;text-align:center;animation:toast 2.6s forwards;box-shadow:0 4px 12px rgba(0,0,0,.35)}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}8%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}

.backdrop{position:fixed;inset:0;background:rgba(20,12,4,.55);z-index:500;display:none}
.backdrop.on{display:block}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:500px;transform:translate(-50%,105%);transition:transform .25s;z-index:510;background:var(--cream);border:3px solid var(--wood);border-bottom:none;border-radius:22px 22px 0 0;max-height:78vh;max-height:78dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:translate(-50%,0)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 8px 16px;font-size:18px;font-weight:900;border-bottom:2px dashed #dcc48a;flex:none}
.sheet-h button{width:36px;height:36px;border-radius:50%;background:#f0dba6;border:2px solid var(--wood);font-size:16px;font-weight:900}
.sheet-b{overflow-y:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:10px;background:#fffdf2;border:2px solid #e3cf9b;border-radius:14px;padding:8px 10px}
.row .ic{font-size:28px;flex:none;width:36px;text-align:center}
.row .tx{flex:1;min-width:0;font-size:12.5px;line-height:1.25}
.row .tx b{font-size:14.5px;display:block}
.row .tx em{font-style:normal;color:#2f7d0c;font-weight:800}
.row.done{background:#e6f7d6;border-color:#a9d98a}
.row.locked{opacity:.6}
.buy{flex:none;min-width:78px;padding:8px 10px;border-radius:12px;background:linear-gradient(#8fd858,#5cb82f);color:#fff;font-weight:900;font-size:13.5px;box-shadow:0 3px 0 #2c6410;text-shadow:0 1px 0 rgba(0,0,0,.3);white-space:nowrap}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #2c6410}
.buy.cant{background:linear-gradient(#d6cfc0,#b9b09c);box-shadow:0 3px 0 #857c69}
.buy.alt{background:linear-gradient(#ffd98a,#ffab2e);box-shadow:0 3px 0 #a86200;color:#5a3300;text-shadow:none}
.buy.red{background:linear-gradient(#ff8f8f,#e5484d);box-shadow:0 3px 0 #8f1d21}
.buy[disabled]{background:#cfc9ba;box-shadow:none;color:#fff}
.pips{display:flex;gap:3px;margin-top:3px}
.pips i{width:14px;height:6px;border-radius:3px;background:#e0d2a6}
.pips i.f{background:var(--green)}
.sub{font-size:12px;font-weight:800;color:#8a6f3c;margin:4px 2px 0}
textarea.save{width:100%;height:70px;border:2px solid #e3cf9b;border-radius:10px;padding:6px;font-size:11px;font-family:monospace;user-select:text;-webkit-user-select:text;resize:none;background:#fff}

.modal{position:fixed;inset:0;z-index:700;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(20,12,4,.6)}
.modal.on{display:flex}

  if (n < 20) return Math.max(1, Math.round(n));

  for (const k in f) if (s[k] === undefined) s[k] = f[k];
  ['boosts', 'up', 'stats', 'weather', 'hot'].forEach(k => { for (const x in f[k]) if (s[k][x] === undefined) s[k][x] = f[k][x]; });
  while (s.areas.length < AREAS.length) s.areas.push(f.areas[s.areas.length]);
  s.areas.forEach(a => a.plots.forEach(p => { if (p.item && !ITEM[p.item]) { p.item = null; p.st = 'empty'; p.n = 0; } }));
  s.areas.forEach(a => { if (a.sel && !ITEM[a.sel]) a.sel = null; });

}
function load() {

}

const curArea = () => S.areas[S.areaIdx];
const curDef = () => AREAS[S.areaIdx];
const waterCap = () => 10 + 4 * S.up.well;
const waterRegen = () => 4 / (1 + 0.3 * S.up.well);       // секунд на одну каплю
const teamMult = () => 1 + 0.5 * S.up.team;
const isRain = () => S.weather.cur === 'rain' || S.weather.cur === 'storm';

function plotPrice(ai) { const d = AREAS[ai]; return nice(d.plotBase * Math.pow(d.plotGrow, S.areas[ai].bought)); }
function bestVegRate() {
  let r = 0;
  for (const it of ITEMS) if (it.k === 'veg' && it.lvl <= S.level) r = Math.max(r, (it.sell - it.cost) / it.t);
  return r;
}
// Примерный доход фермы в секунду — от него считаются цены помощников и размер призов
function income() {
  let s = 0; const bv = bestVegRate();
  S.areas.forEach((a, ai) => {
    if (!a.unlocked) return;
    const d = AREAS[ai];
    a.plots.forEach(p => {
      if (p.st === 'wild') return;
      if (d.kind === 'veg') s += bv * (d.speed || 1);
      else if (p.item) s += ITEM[p.item].sell / ITEM[p.item].t;
    });
  });
  return Math.max(0.5, s);
}
const boostPrice = b => nice(b.sec * income());
const prize = sec => Math.max(3, nice(sec * income()));

function goldChance() {
  let c = 0.10 + 0.02 * S.up.gold;
  if (S.boosts.clover > 0) c *= 2.5;
  if (S.weather.cur === 'rainbow') c *= 3;
  return Math.min(0.85, c);
}
function speedOf(ai, p) {
  if (p.pest) return 0;
  const d = AREAS[ai];
  let s = (d.speed || 1) * (1 + 0.1 * S.up.sprink);
  if (S.boosts.manure > 0) s *= 2;
  if (p.wet > 0 || (!d.indoor && isRain())) s *= 2;
  else if (!d.indoor && S.weather.cur === 'heat') s *= 0.6;
  return s;
}
function addMoney(n) { S.money += n; if (n > 0) S.stats.earned += n; hudDirty = true; }
function spend(n) { if (S.money < n) return false; S.money -= n; hudDirty = true; return true; }
function addXp(n) {

  while (S.xp >= xpNeed(S.level)) { S.xp -= xpNeed(S.level); S.level++; onLevelUp(); }
}

  addMoney(gift); S.water = waterCap();
  const news = [];
  ITEMS.filter(it => it.lvl === L).forEach(it => news.push(`${it.k === 'veg' ? it.e : it.body} ${it.n}${it.k === 'tree' ? ' (в Саду)' : it.k === 'animal' ? ' (во Дворе)' : ''}`));
  AREAS.forEach(d => { if (d.lvl === L) news.push(`${d.icon} Можно открыть: <b>${d.name}</b>`); });
  BOOSTS.forEach(b => { if (b.lvl === L) news.push(`${b.ic} Помощник: ${b.name}`); });
  if (L === 2) news.push('🐛 Берегись: появились вредители! Тапай по ним.');
  if (L === 3) news.push('🥵 Теперь бывает жара — поливай грядки');

    (news.length ? `<ul>${news.map(x => `<li>🆕 ${x}</li>`).join('')}</ul>` : '') +

}

/* =====================================================================
   ДЕЙСТВИЯ НА ГРЯДКАХ

function clearPlot(p) { p.st = 'empty'; p.item = null; p.t = 0; p.total = 0; p.n = 0; p.gold = false; p.mature = false; p.pest = null; }

// что произойдёт при тапе по грядке
function kindFor(i) {
  const p = curArea().plots[i];
  if (p.pest) return 'whack';
  if (p.st === 'wild') return 'buy';
  if (tool === 'remove') return 'remove';
  if (p.n > 0) return 'harvest';
  if (p.st === 'empty') return 'plant';
  if (p.st === 'grow') return 'water';
  return null;
}
function tapPlot(i, dragging) {
  const k = kindFor(i);
  if (k === 'whack') { whack(S.areaIdx, i, true); return k; }
  if (k === 'buy') { if (!dragging) buyPlot(i); return k; }
  if (k === 'remove') { if (!dragging) removePlant(i); return k; }
  if (k === 'harvest') { harvest(S.areaIdx, i, true); return k; }
  if (k === 'plant') { if (dragging && curDef().kind !== 'veg') return null; return plant(S.areaIdx, i, true) ? k : null; }
  if (k === 'water') { return water(i) ? k : (dragging ? null : k); }
  return null;
}

function buyPlot(i) {
  const a = curArea(), p = a.plots[i], price = plotPrice(S.areaIdx);
  if (!spend(price)) { toast(`Нужно ${fmt(price)} 🪙, чтобы расчистить грядку`); sfx('err'); return; }
  p.st = 'empty'; a.bought++; S.stats.plots++;
  const c = plotCenter(i);
  burst(c.x, c.y, ['🍃', '🌿', '💨'], 7); floatText(c.x, c.y, `−${short(price)}🪙`, 'bad'); sfx('buy'); vib(15);
  if (S.tut === 3) S.tut = 4;
}

function plant(ai, i, manual) {
  const a = S.areas[ai], p = a.plots[i], it = ITEM[a.sel];
  if (!it || it.lvl > S.level || it.k !== AREAS[ai].kind) { if (manual) toast('Сначала выбери, что сажать 👇'); return false; }
  if (!spend(it.cost)) { if (manual) { toast(`Не хватает монет: ${it.n} стоит ${fmt(it.cost)} 🪙`); sfx('err'); } return false; }
  p.st = 'grow'; p.item = it.id; p.n = 0; p.gold = false; p.wet = 0; p.pest = null;
  p.mature = it.k === 'animal';
  p.total = p.t = it.k === 'tree' ? it.t * 2 : it.t;      // саженец растёт вдвое дольше обычного плода

}

function water(i) {

  if (p.wet > 4) return false;
  if (!curDef().indoor && isRain()) return false;       // дождь и так поливает
  if (S.water < 1) { toast('💧 Вода кончилась — подожди, колодец наберётся'); return false; }
  S.water -= 1; p.wet = 30; S.stats.water++; hudDirty = true;

// продукт созрел
function ripen(p) {

  if (it.k === 'animal' && p.n < 3) { p.t += it.t; p.total = it.t; }

function harvest(ai, i, manual) {
  const a = S.areas[ai], p = a.plots[i], it = ITEM[p.item];
  if (!it || p.n < 1) return;
  const n = p.n, units = n + (p.gold ? 2 : 0);            // золотой = втрое дороже
  let mult = 1 + 0.1 * S.up.basket;
  if (S.up.palace) mult *= 1.5;

  if (manual) {
    combo = comboLeft > 0 ? combo + 1 : 1; comboLeft = 2.5;
    if (combo > S.stats.combo) S.stats.combo = combo;
    mult *= 1 + Math.min(combo - 1, 10) * 0.05;
  }
  const gain = Math.round(it.sell * units * mult), xp = itemXp(it) * n + (p.gold ? itemXp(it) : 0);

  S.orders.forEach(o => { if (o && o.need) o.need.forEach(q => { if (q.item === it.id) q.got = Math.min(q.qty, q.got + n); }); });
  const wasGold = p.gold;

    else if (manual) { sfx('harvest', combo); vib(8); }

}

  if (S.boosts.insure > 0) { addMoney(value); toast(`🛡️ Страховка вернула ${fmt(value)} 🪙`); }
  else if (cause === 'pest') toast(`😱 Вредитель съел урожай: ${it.n}`);

function pickWeather(prev) {

  if (prev !== 'sun' && S.level < 3) return 'sun';
  let r = Math.random() * list.reduce((s, o) => s + o[1], 0);
  for (const [w, wt] of list) { if (r < wt) return w; r -= wt; }

}

function lightning() {

/* =====================================================================
   ЗАКАЗЫ, ТОВАР ДНЯ, ПОДАРКИ
   ===================================================================== */
function sellablePool() {
  const veg = ITEMS.filter(it => it.k === 'veg' && it.lvl <= S.level).slice(-5);
  const owned = {};
  S.areas.forEach(a => a.plots.forEach(p => { if (p.item && ITEM[p.item].k !== 'veg') owned[p.item] = 1; }));
  return veg.concat(Object.keys(owned).map(id => ITEM[id]));
}
function makeOrder() {
  const pool = sellablePool().sort(() => Math.random() - 0.5);
  const cnt = S.level < 3 ? 1 : Math.min(pool.length, rint(1, 2));
  let coins = 0, xp = 0;
  const need = pool.slice(0, cnt).map(it => {
    // сколько грядок под такую культуру есть у игрока — от этого размер заказа
    let plots = 0;
    S.areas.forEach((a, ai) => { if (a.unlocked && AREAS[ai].kind === it.k) plots += a.plots.filter(p => it.k === 'veg' ? p.st !== 'wild' : p.item === it.id).length; });
    const qty = clamp(Math.round(rnd(160, 340) / cnt / it.t * clamp(plots / 6, 0.6, 2.2)), 2, 24);
    coins += qty * it.sell; xp += qty * itemXp(it);
    return { item: it.id, qty, got: 0 };
  });
  return { who: rint(0, CUSTOMERS.length - 1), need, coins: nice(coins * 1.2), xp: Math.round(xp * 1.5) + 4 };
}
const orderDone = o => o && o.need && o.need.every(q => q.got >= q.qty);

  coinsFly(x, y, 8); sfx('gold'); vib([10, 30, 10]);

  if (sheetName === 'orders') openSheet('orders');
}

  else toast(`${u.ic} ${u.name} улучшен!`);

/* =====================================================================
   ГЛАВНЫЙ ЦИКЛ
   ===================================================================== */
function tick(dt) {
  // погода
  const w = S.weather;
  w.left -= dt;
  if (w.cur === 'storm' && w.strikes.length && w.left <= w.strikes[w.strikes.length - 1]) { w.strikes.pop(); lightning(); }
  if (w.left <= 0) nextWeather();
  // товар дня
  S.hot.left -= dt;
  if (S.hot.left <= 0) newHot();
  // помощники
  for (const k in S.boosts) {
    if (S.boosts[k] > 0) { S.boosts[k] -= dt; if (S.boosts[k] <= 0) { S.boosts[k] = 0; toast(`${BOOST[k].ic} ${BOOST[k].name}: время вышло`); } }
  }
  // колодец
  if (S.water < waterCap()) { const b = Math.floor(S.water); S.water = Math.min(waterCap(), S.water + dt / waterRegen()); if (Math.floor(S.water) !== b) hudDirty = true; }
  // заказы
  S.orders.forEach((o, k) => { if (!o) S.orders[k] = makeOrder(); else if (o.wait !== undefined) { o.wait -= dt; if (o.wait <= 0) { S.orders[k] = makeOrder(); if (S.tut >= 4) sfx('pop'); } } });
  // грядки
  S.areas.forEach((a, ai) => {
    if (!a.unlocked) return;
    a.plots.forEach((p, i) => {
      if (p.wet > 0) p.wet = Math.max(0, p.wet - dt);
      if (p.pest) { p.pest.t -= dt; if (p.pest.t <= 0) { p.pest = null; loseCrop(ai, i, 'pest'); } }
      if (p.st === 'grow' && p.item) { p.t -= dt * speedOf(ai, p); if (p.t <= 0) { ripen(p); if (ai === S.areaIdx && S.tut < 4) sfx('pop'); } }
    });
  });
  for (const k in burns) { burns[k] -= dt; if (burns[k] <= 0) delete burns[k]; }
  // вредители (со 2 уровня)
  if (S.level >= 2) {
    pestClock += dt * (S.boosts.manure > 0 ? 2 : 1);
    if (pestClock >= 9) { pestClock = 0; if (Math.random() < 0.4) spawnPest(); }
  }
  // пёс
  if (S.boosts.dog > 0) { dogClock += dt; if (dogClock >= 1.3) { dogClock = 0; dogAct(); } }
  // работник
  if (S.boosts.worker > 0) { workerClock += dt; if (workerClock >= 1.2 / teamMult()) { workerClock = 0; workerAct(); } }
  // комбо
  if (comboLeft > 0) { comboLeft -= dt; if (comboLeft <= 0) combo = 0; }
  // шарик с подарком
  if (S.level >= 2) { giftClock -= dt; if (giftClock <= 0) { giftClock = rnd(75, 130); spawnGift(); } }
  // подсказка «заказы» держится недолго
  if (S.tut === 4) { tutClock += dt; if (tutClock > 9) S.tut = 5; }
  tipClock += dt; if (tipClock > 14) { tipClock = 0; tipIdx = (tipIdx + 1) % TIPS.length; }
  saveClock += dt; if (saveClock > 5) { saveClock = 0; checkAchievements(); save(); }
}
let tutClock = 0;

function areaOrder() { const o = [S.areaIdx]; S.areas.forEach((a, i) => { if (i !== S.areaIdx && a.unlocked) o.push(i); }); return o; }
function dogAct() {
  for (const ai of areaOrder()) {
    const i = S.areas[ai].plots.findIndex(p => p.pest);
    if (i >= 0) { S.areas[ai].plots[i].pest.hp = 1; whack(ai, i, false); moveSprite($('dogSpr'), ai, i); if (ai === S.areaIdx) sfx('bark'); return; }
  }
}
function workerAct() {
  for (const ai of areaOrder()) {
    const i = S.areas[ai].plots.findIndex(p => p.n > 0 && !p.pest);
    if (i >= 0) { harvest(ai, i, false); moveSprite($('workerSpr'), ai, i); return; }
  }
  for (const ai of areaOrder()) {
    if (AREAS[ai].kind !== 'veg') continue;
    const a = S.areas[ai], it = ITEM[a.sel];
    if (!it || S.money < it.cost) continue;
    const i = a.plots.findIndex(p => p.st === 'empty');
    if (i >= 0 && plant(ai, i, false)) { moveSprite($('workerSpr'), ai, i); return; }
  }
}

// игра была закрыта или свёрнута: растения росли, вредители и погода — нет
function fastForward(sec) {
  sec = Math.min(sec, 12 * 3600);
  let ripe = 0;
  S.areas.forEach((a, ai) => {
    if (!a.unlocked) return;
    const d = AREAS[ai], sp = (d.speed || 1) * (1 + 0.1 * S.up.sprink);
    a.plots.forEach(p => {
      p.pest = null; p.wet = 0;
      if (p.st !== 'grow' || !p.item) return;
      p.t -= sec * sp;
      while (p.st === 'grow' && p.t <= 0) { ripen(p); ripe++; }
    });
  });
  S.water = Math.min(waterCap(), S.water + sec / waterRegen());
  S.orders.forEach(o => { if (o && o.wait !== undefined) o.wait -= sec; });
  S.hot.left -= sec;
  if (sec > S.weather.left) S.weather = { cur: 'sun', left: rnd(60, 120), next: pickWeather('sun'), strikes: [] };
  else S.weather.left -= sec;
  combo = 0; comboLeft = 0;
  return ripe;
}

/* =====================================================================
   ФОРМАТЫ ЧИСЕЛ И ВРЕМЕНИ
   ===================================================================== */
function fmt(n) {
  n = Math.floor(n);
  if (n < 1e6) return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  if (n < 1e9) return (n / 1e6).toFixed(n < 1e7 ? 2 : 1).replace('.', ',') + ' млн';
  return (n / 1e9).toFixed(2).replace('.', ',') + ' млрд';
}
function short(n) {
  n = Math.round(n);
  if (n < 1000) return String(n);
  if (n < 1e6) return (n / 1e3).toFixed(n < 1e4 ? 1 : 0).replace(/\.0$/, '').replace('.', ',') + 'к';
  return (n / 1e6).toFixed(n < 1e7 ? 1 : 0).replace(/\.0$/, '').replace('.', ',') + 'м';
}
function fmtT(s) {
  s = Math.max(0, Math.ceil(s));
  if (s < 60) return s + 'с';
  const m = Math.floor(s / 60), r = s % 60;
  if (m < 60) return m + ':' + (r < 10 ? '0' : '') + r;
  return Math.floor(m / 60) + 'ч ' + (m % 60) + 'м';
}

/* =====================================================================
   ЗВУК (синтезатор — без файлов) И ВИБРАЦИЯ
   ===================================================================== */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type, vol, f2, delay) {
  const c = audio(); if (!c) return;
  const t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(vol || 0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.03);
}
function noise(d, vol, freq) {
  const c = audio(); if (!c) return;
  const len = Math.floor(c.sampleRate * d), buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = c.createBufferSource(), flt = c.createBiquadFilter(), g = c.createGain();
  src.buffer = buf; flt.type = 'lowpass'; flt.frequency.value = freq; g.gain.value = vol;
  src.connect(flt); flt.connect(g); g.connect(c.destination); src.start();
}
function sfx(name, arg) {
  if (!S || !S.sound) return;
  switch (name) {
    case 'plant':   tone(280, 0.09, 'triangle', 0.10, 430); break;
    case 'harvest': { const k = 1 + Math.min(arg || 1, 11) * 0.06; tone(500 * k, 0.1, 'triangle', 0.12, 900 * k); break; }
    case 'water':   tone(950, 0.14, 'sine', 0.07, 380); break;
    case 'whack':   noise(0.09, 0.3, 1400); tone(170, 0.1, 'square', 0.06, 70); break;
    case 'buy':     tone(390, 0.08, 'triangle', 0.1); tone(590, 0.12, 'triangle', 0.1, null, 0.07); break;
    case 'pop':     tone(700, 0.06, 'sine', 0.06, 1000); break;
    case 'pest':    tone(240, 0.12, 'sawtooth', 0.04, 200); tone(240, 0.12, 'sawtooth', 0.04, 200, 0.16); break;
    case 'bark':    tone(330, 0.07, 'square', 0.05, 220); break;
    case 'err':     tone(190, 0.14, 'sawtooth', 0.05, 120); break;
    case 'gold':    [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.14, 'triangle', 0.09, null, i * 0.06)); break;
    case 'level':   [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.16, 'triangle', 0.1, null, i * 0.09)); break;
    case 'thunder': noise(1.3, 0.55, 260); break;
    case 'click':   tone(600, 0.04, 'sine', 0.05); break;
  }
}

      { transform: `translate(calc(-50% + ${tx - x}px), calc(-50% + ${ty - y}px)) scale(.6)`, opacity: 0.9 }],

const lastToast = {};

function bindInput() {

    const el = e.target.closest('.plot'); if (!el) return;

    const el = document.elementFromPoint(e.clientX, e.clientY), pl = el && el.closest ? el.closest('.plot') : null;
    if (!pl || pl.parentNode !== field) return;
    const i = +pl.dataset.i; if (i === drag.last) return;
    drag.last = i;
    const k = kindFor(i);
    if (k === drag.kind || k === 'whack') { tapPlot(i, true); renderField(); }
  });
  const end = () => { drag = null; };
  window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
  field.addEventListener('contextmenu', e => e.preventDefault());

  $('seedStrip').addEventListener('click', e => {

  $('hotChip').addEventListener('click', () => { const it = ITEM[S.hot.item]; if (it) toast(`🔥 Товар дня: ${it.e} ${it.k === 'animal' ? it.pn : it.n} продаётся в 2 раза дороже`); });

let lastTick = 0;
function loop() {
  const now = Date.now();
  let dt = lastTick ? (now - lastTick) / 1000 : (now - S.last) / 1000;
  lastTick = now;
  if (dt > 5) {                       // вернулись после перерыва
    const ripe = fastForward(dt);
    if (dt > 90) queueModal(`<div class="big">😴</div><h2>С возвращением!</h2><p>Тебя не было ${fmtT(dt)}.</p><p>${ripe > 0 ? `Пока ты отдыхал, созрело: <b>${ripe}</b> 🧺 Собирай скорее!` : 'Ферма ждала тебя.'}</p><div class="btns"><button class="buy" data-close>За работу!</button></div>`);
    renderAll();
  } else if (dt > 0) tick(Math.min(dt, 1));
  S.last = now;
  renderFrame();
}

  if (!saved) {
    let old = false;
    try { old = !!(localStorage.getItem('antonFarmSave2') || localStorage.getItem('antonFarmSave')); } catch (e) { /* нет доступа */ }
    if (old) { S.money += 50; queueModal(`<div class="big">👋</div><h2>Привет, опытный фермер!</h2><p>Это новая Ферма Антоши 3. Здесь всё начинается заново, но за старые заслуги держи подарок: <b>+50 🪙</b></p><div class="btns"><button class="buy" data-close>Спасибо!</button></div>`); }
  }
  if (!S.hot.item || !ITEM[S.hot.item]) newHot();
  S.music = false;
  bindInput();
  parkSprites();
  renderAll();
  loop();
  setInterval(loop, 250);
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('ferma3-sw.js').catch(() => {});
}
boot();
</script>
